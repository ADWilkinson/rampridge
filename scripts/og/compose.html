<!doctype html>
<!-- Link preview card layout: a captured scene, darkened under the logo and the copy. compose.mjs fills it in. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "RS Bold 12";
        src: url("../../public/game/fonts/RuneScape-Bold-12.ttf");
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #c {
        position: relative;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
      }
      .bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .logo {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: block;
      }
      .lines {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .l {
        font-family: "RS Bold 12";
        line-height: 1;
        white-space: nowrap;
        -webkit-font-smoothing: none;
      }
      .l1 {
        font-size: 48px;
        color: #ffff00;
        text-shadow: 3px 3px 0 #000;
      }
      .l2 {
        font-size: 32px;
        color: #ffffff;
        text-shadow: 2px 2px 0 #000;
      }
      .l3 {
        font-size: 32px;
        color: #ff981f;
        text-shadow: 2px 2px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="c">
      <img id="scene" alt="" />
      <div class="top" id="top"></div>
      <div class="bottom" id="bottom"></div>
      <img class="logo" id="logo" src="../../public/game/ui/logo.png" alt="" />
      <div class="lines" id="lines">
        <div class="l l1">Buy and sell USDC for cash</div>
        <div class="l l2">with real players. Settled on Base by Peer.</div>
      </div>
    </div>
  </body>
</html>
